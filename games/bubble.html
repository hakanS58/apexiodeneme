<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bubble Rush</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;

}


body{

font-family:'Poppins',sans-serif;

min-height:100vh;

overflow:hidden;

color:white;


background:

radial-gradient(
circle at top,
#273b75,
#080d18 70%
);

}



.game-header{


height:100px;

display:flex;

justify-content:space-around;

align-items:center;

background:

rgba(255,255,255,.06);

backdrop-filter:blur(15px);

border-bottom:

1px solid rgba(255,255,255,.1);


}


.stat{

text-align:center;

}


.stat span{

display:block;

font-size:13px;

color:#b8c5e8;

}


.stat strong{

font-size:25px;

}



#gameArea{


position:relative;

height:calc(100vh - 100px);

overflow:hidden;


}



.bubble{


position:absolute;

border-radius:50%;

cursor:pointer;


display:flex;

align-items:center;

justify-content:center;


background:

linear-gradient(
135deg,
#6d5dfc,
#2196f3
);


box-shadow:

0 0 25px rgba(80,160,255,.7);


animation:

float 5s linear infinite;


}



.bubble:active{


transform:scale(.8);


}



@keyframes float{


from{

transform:translateY(120vh);

}


to{

transform:translateY(-150px);

}


}



.start-screen{


position:absolute;

inset:0;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:20px;


background:

rgba(5,8,20,.6);


z-index:10;


}



.start-screen h1{


font-size:38px;


}



.start-screen p{


color:#b8c5e8;

text-align:center;

}



button{


border:none;

padding:16px 35px;

border-radius:20px;

font-size:18px;

font-weight:700;

cursor:pointer;

color:white;


background:

linear-gradient(
135deg,
#6d5dfc,
#2196f3
);


}



.end-card{


display:none;

position:absolute;

inset:0;

background:

rgba(5,8,20,.85);


z-index:20;


align-items:center;

justify-content:center;

flex-direction:column;

gap:15px;


text-align:center;


}



.end-card h2{

font-size:35px;

}



.record{

color:#87c9ff;

font-weight:700;

}

.back-btn{

position:absolute;

left:15px;

top:25px;

width:45px;

height:45px;

border-radius:15px;

padding:0;

font-size:24px;

z-index:50;

}


.game-header{

position:relative;

}


#musicBtn{

background:

rgba(255,255,255,.12);

font-size:15px;

padding:12px 25px;

}

.settings-card{


display:none;


position:absolute;

inset:0;


background:

rgba(5,8,20,.9);


z-index:30;


align-items:center;

justify-content:center;

flex-direction:column;


gap:20px;


text-align:center;


}


.settings-card h2{

font-size:32px;

}



.settings-card button{


min-width:180px;

}

.danger-time{

color:#ff5252;

animation:pulse .5s infinite alternate;

}


@keyframes pulse{

from{

transform:scale(1);

}

to{

transform:scale(1.15);

}

}

.shop-card{


display:none;


position:absolute;

inset:0;


background:

rgba(5,8,20,.95);


z-index:40;


align-items:center;

justify-content:center;

flex-direction:column;


gap:20px;


text-align:center;


}



.shop-items{


display:grid;


grid-template-columns:repeat(2,130px);


gap:15px;


}



.shop-items button{


height:120px;

font-size:16px;

}

/* =====================
BUBBLE STYLES
===================== */



.bubble.neon{


background:

linear-gradient(
135deg,
#ff00cc,
#3333ff
);


box-shadow:

0 0 35px #ff00cc;


}




.bubble.fire{


background:

linear-gradient(
135deg,
#ff9800,
#ff1744
);


box-shadow:

0 0 40px #ff5722;


}





.bubble.crystal{


background:

linear-gradient(
135deg,
#00e5ff,
#651fff
);



box-shadow:

0 0 40px #00e5ff;


}




</style>


</head>


<body>


<header class="game-header">

    <button class="back-btn" onclick="goBack()">
←
</button>


<div class="stat">

<span>Skor</span>

<strong id="score">
0
</strong>

</div>


<div class="stat">

<span>Süre</span>

<strong id="time">
30
</strong>

</div>



<div class="stat">

<span>Rekor</span>

<strong id="high">
0
</strong>

</div>

<div class="stat">

<span>
🪙 Coin
</span>

<strong id="coin">
0
</strong>

</div>

</header>




<div id="gameArea">


<div class="start-screen" id="startScreen">


<h1>
🫧 Bubble Rush
</h1>


<p>
30 saniyede olabildiğince<br>
fazla balon patlat!
</p>


<button onclick="startGame()">
Başla
</button>
<button onclick="openShop()">
🏪 Balon Dükkanı
</button>
<button onclick="openSettings()">
⚙️ Ayarlar
</button>

</div>



<div class="end-card" id="endCard">


<h2>
Oyun Bitti
</h2>


<h3>
Skor:
<span id="finalScore">
0
</span>
</h3>


<p class="record" id="recordText">

</p>


<button onclick="location.reload()">
Tekrar Oyna
</button>


</div>

<div class="settings-card" id="settingsCard">


<h2>
⚙️ Ayarlar
</h2>


<p>
🎵 Oyun Müziği
</p>


<button onclick="toggleMusicSetting()" id="musicSetting">

Açık

</button>



<br><br>


<button onclick="closeSettings()">

Kaydet

</button>


</div>

<div class="shop-card" id="shopCard">


<h2>
🏪 Bubble Shop
</h2>


<p>
Coin:
🪙 <span id="shopCoin">0</span>
</p>



<div class="shop-items">


<button onclick="buyBubble('normal')">

🫧
<br>
Standart

<br>
Ücretsiz

</button>



<button onclick="buyBubble('neon')">

🌈
<br>
Neon Balon

<br>
100 🪙

</button>




<button onclick="buyBubble('fire')">

🔥
<br>
Ateş Balonu

<br>
250 🪙

</button>



<button onclick="buyBubble('crystal')">

💎
<br>
Kristal Balon

<br>
500 🪙

</button>



</div>


<br>


<button onclick="closeShop()">

Kapat

</button>



</div>


</div>






<script>


let score=0;

let time=30;

let combo=0;

let gameStarted=false;

let timer;

let difficultySpeed = 1;

let bubbleSpawner = null;
let gameRunning = false;


let highScore=

localStorage.getItem("bubbleHighScore") || 0;


document.getElementById("high").innerText=highScore;



const area=document.getElementById("gameArea");



function startGame(){


gameStarted=true;
gameRunning=true;
startMusic();


document.getElementById("startScreen").style.display="none";
document.querySelector(".back-btn").style.display="none";


timer=setInterval(()=>{


time--;


document.getElementById("time").innerText=time;

let timeElement=
document.getElementById("time");


if(time<=5){

timeElement.classList.add(
"danger-time"
);

}

else{

timeElement.classList.remove(
"danger-time"
);

}

// Zorluk sistemi

if(time > 20){

    difficultySpeed = 1;

}


else if(time > 10){

    difficultySpeed = 1.5;

}


else if(time > 5){

    difficultySpeed = 2;

}


else{

    difficultySpeed = 2.5;

}



if(time<=0){

endGame();

}


},1000);



let bubbleSpawner;


bubbleSpawner=setInterval(()=>{

if(gameRunning){

createBubble();

}

},500);



}





function createBubble(){


if(!gameRunning) return;


let bubble=document.createElement("div");


bubble.className="bubble";
bubble.classList.add(
bubbleStyle
);
bubble.style.zIndex="5";
bubble.style.pointerEvents="auto";



let size=Math.random()*45+35;


bubble.style.width=size+"px";

bubble.style.height=size+"px";


bubble.style.left=

Math.random()*(window.innerWidth-size)+"px";



let speed =
(Math.random()*3+3)
/ difficultySpeed;


bubble.style.animationDuration=speed+"s";



bubble.addEventListener("pointerdown",function(e){


e.preventDefault();


score+=10;


combo++;


if(combo>=5){

score+=20;

}



document.getElementById("score").innerText=score;


bubble.style.transform="scale(0)";


setTimeout(()=>{

bubble.remove();

},100);


});



area.appendChild(bubble);



setTimeout(()=>{


bubble.remove();


},6000);



}





function endGame(){


gameStarted=false;

gameRunning=false;


clearInterval(timer);
clearInterval(bubbleSpawner);

document.querySelector(".back-btn").style.display="block";
document.querySelectorAll(".bubble")
.forEach(b=>b.remove());



document.getElementById("finalScore").innerText=score;
addCoins();
document.getElementById("coin").innerText=coins;


let record=document.getElementById("recordText");



if(score>highScore){


localStorage.setItem(
"bubbleHighScore",
score
);


record.innerText=
"🏆 Yeni Rekor!";


}

else{


record.innerText=
"En yüksek skor: "+highScore;


}



document.getElementById("endCard")
.style.display="flex";


}


// =============================
// BUBBLE RUSH GAME MUSIC
// =============================


let musicContext;
let musicPlaying=false;
let musicTimer;


const melody=[

261.63,
329.63,
392.00,
523.25,
392.00,
329.63,
293.66,
349.23

];


let noteIndex=0;



function startMusic(){


if(musicPlaying) return;



musicContext =
new AudioContext();



musicPlaying=true;



musicTimer=setInterval(()=>{


playNote(
melody[noteIndex]
);


noteIndex++;


if(noteIndex>=melody.length){

noteIndex=0;

}



},350);



}



function playNote(freq){


if(!musicContext) return;



let osc =
musicContext.createOscillator();


let gain =
musicContext.createGain();



osc.type="square";


osc.frequency.value=freq;



gain.gain.value=0.025;



osc.connect(gain);


gain.connect(
musicContext.destination
);



osc.start();



gain.gain.exponentialRampToValueAtTime(

0.001,

musicContext.currentTime+0.25

);



osc.stop(
musicContext.currentTime+0.25
);



}




function stopMusic(){


clearInterval(musicTimer);


if(musicContext){

musicContext.close();

}


musicPlaying=false;


}



function toggleMusic(){



if(musicPlaying){


stopMusic();


document.getElementById("musicBtn").innerText=
"🎵 Müziği Aç";


}

else{


startMusic();


document.getElementById("musicBtn").innerText=
"🔇 Müziği Kapat";


}



}

function goBack(){

if(gameRunning){

return;

}


window.location.href="../mola.html";

}

// =================================
// COIN SYSTEM
// =================================


let coins =
Number(localStorage.getItem("bubbleCoins"))
||0;



document.getElementById("coin").innerText=coins;



function addCoins(){


let earned =
Math.floor(score/10);



coins+=earned;



localStorage.setItem(
"bubbleCoins",
coins
);



}

// =================================
// SETTINGS
// =================================



let musicEnabled =
localStorage.getItem(
"bubbleMusic"
);



if(musicEnabled===null){

musicEnabled="true";

}



function openSettings(){


document.getElementById(
"settingsCard"
)
.style.display="flex";


}



function closeSettings(){


document.getElementById(
"settingsCard"
)
.style.display="none";


}



function toggleMusicSetting(){



if(musicEnabled==="true"){


musicEnabled="false";


document.getElementById(
"musicSetting"
).innerText="Kapalı";


}

else{


musicEnabled="true";


document.getElementById(
"musicSetting"
).innerText="Açık";


}



localStorage.setItem(
"bubbleMusic",
musicEnabled
);



}

// =================================
// BUBBLE SHOP SYSTEM
// =================================



let bubbleStyle =
localStorage.getItem(
"bubbleStyle"
)
||
"normal";



let ownedStyles =
JSON.parse(
localStorage.getItem(
"ownedStyles"
)
)
||
[
"normal"
];





function openShop(){


document.getElementById(
"shopCard"
)
.style.display="flex";


document.getElementById(
"shopCoin"
)
.innerText=coins;


}




function closeShop(){


document.getElementById(
"shopCard"
)
.style.display="none";


}




function buyBubble(style){



let prices={


normal:0,

neon:100,

fire:250,

crystal:500


};



let price=
prices[style];





if(
ownedStyles.includes(style)
){


bubbleStyle=style;


localStorage.setItem(
"bubbleStyle",
style
);


alert(
"Aktif balon değiştirildi!"
);


return;


}




if(coins < price){


alert(
"Yeterli coin yok!"
);


return;


}




coins-=price;



localStorage.setItem(
"bubbleCoins",
coins
);




ownedStyles.push(style);



localStorage.setItem(

"ownedStyles",

JSON.stringify(ownedStyles)

);



bubbleStyle=style;



localStorage.setItem(
"bubbleStyle",
style
);



document.getElementById(
"shopCoin"
)
.innerText=coins;



alert(
"Yeni balon açıldı!"
);


}



</script>


</body>

</html>
